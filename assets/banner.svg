<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" fill="none" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0d17"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#060913"/></linearGradient><linearGradient id="accent-cyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#818cf8"/></linearGradient><linearGradient id="shield-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="50%" stop-color="#3b82f6" stop-opacity=".4"/><stop offset="100%" stop-color="#6366f1" stop-opacity=".1"/></linearGradient><linearGradient id="glow-grad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".5" stroke-width=".8" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes pulseGlow{0%{opacity:.35;filter:drop-shadow(0 0 15px rgba(56,189,248,.2))}}@keyframes ping{0%{r:4px;opacity:1}75%{r:16px;opacity:0}}.glow-pulse{animation:pulseGlow 4s ease-in-out infinite alternate}.circuit-flow{stroke-dasharray:8 16;animation:flowDash 20s linear infinite}.radar-sweep{transform-origin:980px 180px;animation:rotateRadar 10s linear infinite}.node-pulse-1{animation:ping 3s cubic-bezier(0,0,.2,1) infinite}.node-pulse-2{animation:ping 3s cubic-bezier(0,0,.2,1) 1.5s infinite}.orbit-spin{transform-origin:980px 180px;animation:rotateRadar 24s linear infinite reverse}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif}.title-text{font-weight:800;font-size:40px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:400;font-size:16px;fill:#94a3b8;letter-spacing:.2px}.badge-text{font-weight:600;font-size:12px;fill:#38bdf8;letter-spacing:1px}.chip-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif;font-size:11px;font-weight:500;fill:#cbd5e1}</style></defs><rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><circle cx="200" cy="80" r="140" fill="#0ea5e9" class="glow-pulse" filter="blur(40px)" opacity=".12"/><circle cx="980" cy="180" r="180" fill="#6366f1" class="glow-pulse" filter="blur(50px)" opacity=".15"/><circle cx="600" cy="300" r="120" fill="#3b82f6" filter="blur(40px)" opacity=".08"/><g fill="none" stroke="#38bdf8" stroke-width="1.5" class="circuit-flow" opacity=".4"><path d="M 0 120 L 280 120 L 340 180 L 520 180"/><path d="M 120 360 L 120 280 L 200 200 L 420 200"/><path stroke="#818cf8" d="M 700 80 L 820 80 L 880 140 L 1200 140"/><path stroke="#818cf8" d="M 760 300 L 860 300 L 920 240 L 1200 240"/></g><g transform="translate(0, 0)"><circle cx="980" cy="180" r="130" fill="none" stroke="#1e293b" stroke-width="1.5"/><circle cx="980" cy="180" r="95" fill="none" stroke="#334155" stroke-dasharray="4 6" stroke-width="1.5"/><circle cx="980" cy="180" r="60" fill="none" stroke="#0284c7" stroke-opacity=".4" stroke-width="1.5"/><g class="radar-sweep"><line x1="980" x2="980" y1="180" y2="50" stroke="url(#accent-cyan)" stroke-linecap="round" stroke-width="2" opacity=".8"/><polygon fill="url(#glow-grad)" points="980 180 940 65 980 50"/></g><path fill="url(#shield-grad)" stroke="#38bdf8" stroke-width="2.5" d="M 980 140 Q 1015 140 1020 170 C 1020 205 980 225 980 230 C 980 225 940 205 940 170 Q 945 140 980 140 Z"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8" d="M 968 180 L 976 188 L 994 170"/><circle cx="1045" cy="120" r="4" fill="#38bdf8"/><circle cx="1045" cy="120" r="4" fill="#38bdf8" class="node-pulse-1"/><circle cx="920" cy="225" r="4" fill="#818cf8"/><circle cx="920" cy="225" r="4" fill="#818cf8" class="node-pulse-2"/><circle cx="1025" cy="235" r="3.5" fill="#34d399"/><g class="orbit-spin"><circle cx="980" cy="85" r="5" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)"/></g></g><g transform="translate(80, 52)"><rect width="210" height="28" fill="#0369a1" fill-opacity=".25" stroke="#0ea5e9" stroke-width="1.2" rx="14"/><circle cx="16" cy="14" r="4" fill="#38bdf8"/><text x="28" y="18" class="badge-text">ENTERPRISE CYBERSECURITY</text></g><g><text class="title-text" transform="translate(80, 126)">Awesome <tspan fill="url(#accent-cyan)">SSPM</tspan></text></g><g><text fill="#f1f5f9" class="subtitle-text" font-weight="600" transform="translate(80, 168)">SaaS Security Posture Management &amp; Access Governance</text></g><g><text class="subtitle-text" font-size="14.5" transform="translate(80, 196)">Curated directory of leading platforms, open-source CLIs, ITDR, and compliance frameworks.</text></g><g transform="translate(80, 240)"><rect width="145" height="30" x="0" y="0" fill="#1e293b" fill-opacity=".8" stroke="#334155" stroke-width="1" rx="15"/><circle cx="14" cy="15" r="3" fill="#38bdf8"/><text x="24" y="19" class="chip-text">Posture Hardening</text><rect width="128" height="30" x="157" y="0" fill="#1e293b" fill-opacity=".8" stroke="#334155" stroke-width="1" rx="15"/><circle cx="171" cy="15" r="3" fill="#818cf8"/><text x="181" y="19" class="chip-text">Identity &amp; ITDR</text><rect width="140" height="30" x="297" y="0" fill="#1e293b" fill-opacity=".8" stroke="#334155" stroke-width="1" rx="15"/><circle cx="311" cy="15" r="3" fill="#34d399"/><text x="321" y="19" class="chip-text">OAuth &amp; Non-Human</text><rect width="138" height="30" x="449" y="0" fill="#1e293b" fill-opacity=".8" stroke="#334155" stroke-width="1" rx="15"/><circle cx="463" cy="15" r="3" fill="#f43f5e"/><text x="473" y="19" class="chip-text">Continuous Audit</text></g><rect width="1198.5" height="358.5" x=".75" y=".75" fill="none" stroke="#334155"