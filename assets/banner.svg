<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5"/>
    </pattern>

    <style>
      .glow-pulse {
        animation: pulseGlow 4s ease-in-out infinite alternate;
      }
      .circuit-flow {
        stroke-dasharray: 8 16;
        animation: flowDash 20s linear infinite;
      }
      .radar-sweep {
        transform-origin: 980px 180px;
        animation: rotateRadar 10s linear infinite;
      }
      .node-pulse-1 {
        animation: ping 3s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .node-pulse-2 {
        animation: ping 3s cubic-bezier(0, 0, 0.2, 1) 1.5s infinite;
      }
      .orbit-spin {
        transform-origin: 980px 180px;
        animation: rotateRadar 24s linear infinite reverse;
      }

      @keyframes pulseGlow {
        0% { opacity: 0.35; filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.2)); }
        100% { opacity: 0.75; filter: drop-shadow(0 0 35px rgba(99, 102, 241, 0.5)); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -320; }
      }
      @keyframes rotateRadar {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes ping {
        0% { r: 4px; opacity: 1; }
        75%, 100% { r: 16px; opacity: 0; }
      }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 40px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #38bdf8;
        letter-spacing: 1px;
      }
      .chip-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        font-weight: 500;
        fill: #cbd5e1;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Ambient Dynamic Glow Orbs in Background -->
  <circle cx="200" cy="80" r="140" fill="#0ea5e9" opacity="0.12" filter="blur(40px)" class="glow-pulse" />
  <circle cx="980" cy="180" r="180" fill="#6366f1" opacity="0.15" filter="blur(50px)" class="glow-pulse" />
  <circle cx="600" cy="300" r="120" fill="#3b82f6" opacity="0.08" filter="blur(40px)" />

  <!-- Dynamic Circuit Lines in Background (stays behind foreground text) -->
  <g opacity="0.4" class="circuit-flow" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path d="M 0 120 L 280 120 L 340 180 L 520 180" />
    <path d="M 120 360 L 120 280 L 200 200 L 420 200" />
    <path d="M 700 80 L 820 80 L 880 140 L 1200 140" stroke="#818cf8" />
    <path d="M 760 300 L 860 300 L 920 240 L 1200 240" stroke="#818cf8" />
  </g>

  <!-- Right Side Interactive Graphic: Dynamic Radar / Shield Visual -->
  <g transform="translate(0, 0)">
    <!-- Concentric Target Circles -->
    <circle cx="980" cy="180" r="130" stroke="#1e293b" stroke-width="1.5" fill="none" />
    <circle cx="980" cy="180" r="95" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6" fill="none" />
    <circle cx="980" cy="180" r="60" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.4" fill="none" />

    <!-- Rotating Radar Sweep Line -->
    <g class="radar-sweep">
      <line x1="980" y1="180" x2="980" y2="50" stroke="url(#accent-cyan)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
      <polygon points="980,180 940,65 980,50" fill="url(#glow-grad)" />
    </g>

    <!-- Center Security Shield -->
    <path d="M 980 140 Q 1015 140 1020 170 C 1020 205 980 225 980 230 C 980 225 940 205 940 170 Q 945 140 980 140 Z" 
          fill="url(#shield-grad)" stroke="#38bdf8" stroke-width="2.5" />
    
    <!-- Shield Check Icon -->
    <path d="M 968 180 L 976 188 L 994 170" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Pulsing Radar Target Nodes -->
    <circle cx="1045" cy="120" r="4" fill="#38bdf8" />
    <circle cx="1045" cy="120" r="4" fill="#38bdf8" class="node-pulse-1" />

    <circle cx="920" cy="225" r="4" fill="#818cf8" />
    <circle cx="920" cy="225" r="4" fill="#818cf8" class="node-pulse-2" />

    <circle cx="1025" cy="235" r="3.5" fill="#34d399" />

    <!-- Orbiting Satellite Indicator -->
    <g class="orbit-spin">
      <circle cx="980" cy="85" r="5" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)" />
    </g>
  </g>

  <!-- Foreground Content: Pill Badge -->
  <g transform="translate(80, 52)">
    <rect width="210" height="28" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#0ea5e9" stroke-width="1.2" />
    <circle cx="16" cy="14" r="4" fill="#38bdf8" />
    <text x="28" y="18" class="badge-text">ENTERPRISE CYBERSECURITY</text>
  </g>

  <!-- Foreground Content: Main Headline (Clear, High Contrast, Guaranteed Foreground) -->
  <g transform="translate(80, 126)">
    <text class="title-text">
      Awesome <tspan fill="url(#accent-cyan)">SSPM</tspan>
    </text>
  </g>
  <g transform="translate(80, 168)">
    <text class="subtitle-text" font-weight="600" fill="#f1f5f9">
      SaaS Security Posture Management &amp; Access Governance
    </text>
  </g>
  <g transform="translate(80, 196)">
    <text class="subtitle-text" font-size="14.5px">
      Curated directory of leading platforms, open-source CLIs, ITDR, and compliance frameworks.
    </text>
  </g>

  <!-- Foreground Tags / Feature Chips -->
  <g transform="translate(80, 240)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="145" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="15" r="3" fill="#38bdf8" />
    <text x="24" y="19" class="chip-text">Posture Hardening</text>

    <!-- Chip 2 -->
    <rect x="157" y="0" width="128" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="171" cy="15" r="3" fill="#818cf8" />
    <text x="181" y="19" class="chip-text">Identity &amp; ITDR</text>

    <!-- Chip 3 -->
    <rect x="297" y="0" width="140" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="311" cy="15" r="3" fill="#34d399" />
    <text x="321" y="19" class="chip-text">OAuth &amp; Non-Human</text>

    <!-- Chip 4 -->
    <rect x="449" y="0" width="138" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="463" cy="15" r="3" fill="#f43f5e" />
    <text x="473" y="19" class="chip-text">Continuous Audit</text>
  </g>

  <!-- Border Frame Accent Line -->
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="15.25" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
